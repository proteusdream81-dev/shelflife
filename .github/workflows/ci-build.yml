name: Build validation

on:
  push:
    branches:
      - fixes/base44-local-sync-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test private R2 cover Worker\n        run: npm run test:r2-worker\n      - name: Test browser catalogue search
        run: npm run test:catalogue
      - name: Test local cover OCR validation
        run: npm run test:ocr
      - name: Build application
        run: npm run build

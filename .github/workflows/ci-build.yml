name: Build validation

on:
  push:
    branches:
      - fixes/base44-local-sync-recovery
  pull_request:
    branches:
      - main
      - migration/vercel-backend-foundation
      - migration/firebase-admin-revocation-preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Test Firebase token verification and Firestore ownership
        run: npm run test:auth
      - name: Test browser catalogue search
        run: npm run test:catalogue
      - name: Test local cover OCR validation
        run: npm run test:ocr
      - name: Build application
        run: npm run build

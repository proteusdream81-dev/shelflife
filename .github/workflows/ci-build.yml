name: Build validation

on:
  push:
    branches:
      - fixes/base44-local-sync-recovery
      - backup/direct-rest-export-runner
  pull_request:
    branches:
      - main
      - backup/actor-room-export

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test browser catalogue search
        run: npm run test:catalogue
      - name: Test local cover OCR validation
        run: npm run test:ocr
      - name: Test backup encryption round-trip and tamper rejection
        run: npm run test:backup-crypto
      - name: Test independent direct export cryptography and digests
        run: npm run test:direct-export
      - name: Test actor backup response validation
        run: npm run test:actor-backup
      - name: Build application
        run: npm run build
